[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-select = ["B", "I"]  # flake8-bugbear, import sorting
fix = true
unsafe-fixes = false
exclude = ["node_modules", ".venv", "venv", "dist", "build"]

[tool.ruff.lint]
ignore = ["E501"]  # handled by formatter

[tool.isort]
profile = "black"
line_length = 100

[tool.prettier]
printWidth = 100
