services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./artifacts:/app/artifacts:ro
    environment:
      - MODEL_PATH=/app/artifacts/model.bin
      - MODEL_VERSION=trained-v1
      - MODEL_HASH=53a9ed9fd60ea58fb6bbe76fc0a2751534046270b127697a114e6543363bbc2d
      - MODEL_DEVICE=cpu
      - BOARD_SIZE=10
      - LOG_LEVEL=debug
      - OBSERVABILITY_ENABLED=true
      - DETERMINISTIC_MODE=false
      - FRONTEND_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 2s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:80"
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    environment:
      - TRAIN_OUTPUT=/app/artifacts
      - TRAIN_ARTIFACT_NAME=model.bin
      - TRAIN_EPOCHS=100
      - TRAIN_SEED=42
      - TRAIN_DEVICE=cpu
      - TRAIN_BOARD_SIZE=10
      - TRAIN_ALLOW_ADJACENT=true
    volumes:
      - ./configs:/app/configs:ro
      - ./artifacts:/app/artifacts
    command: ["python", "-m", "training.trainer"]
