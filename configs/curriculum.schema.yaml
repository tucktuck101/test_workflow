type: object
required:
  - version
  - phases
properties:
  version:
    type: string
    description: Schema version identifier.
  phases:
    type: array
    minItems: 1
    description: Ordered list of curriculum phases.
    items:
      type: object
      required:
        - id
        - name
        - description
        - gating
      properties:
        id:
          type: string
          description: Unique phase identifier.
        name:
          type: string
          description: Human readable name.
        description:
          type: string
          description: Short text describing the objective of the phase.
        gating:
          type: object
          required: []
          properties:
            min_episodes:
              type: integer
              minimum: 0
            min_rounds:
              type: integer
              minimum: 0
            min_win_rate:
              type: number
              minimum: 0
              maximum: 1
            min_avg_moves:
              type: number
              exclusiveMinimum: 0
            min_baseline_win_rate:
              type: number
              minimum: 0
              maximum: 1
        opponents:
          type: array
          description: Weighted opponent mix for this phase.
          items:
            type: object
            required:
              - opponent
              - weight
            properties:
              opponent:
                type: string
              weight:
                type: number
                exclusiveMinimum: 0
              params:
                type: object
                additionalProperties: true
        hyperparams:
          type: object
          properties:
            train:
              type: object
              properties:
                board_size:
                  type: integer
                  minimum: 2
                allow_adjacent:
                  type: boolean
                ships:
                  type: array
                  items:
                    type: array
                    items:
                      - type: string
                      - type: integer
                  minItems: 2
                reward_step_base:
                  type: number
                reward_step_decay:
                  type: number
                reward_step_cap:
                  type: number
                reward_hit:
                  type: number
                reward_miss:
                  type: number
                reward_sink_mult:
                  type: number
                reward_win_max:
                  type: number
                reward_win_decay_k:
                  type: number
                reward_loss:
                  type: number
                reward_perfect_move:
                  type: integer
            dqn:
              type: object
              properties:
                epsilon_start:
                  type: number
                epsilon_end:
                  type: number
                epsilon_min:
                  type: number
                epsilon_decay:
                  type: integer
                  minimum: 1
                lr:
                  type: number
                  exclusiveMinimum: 0
                gamma:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1
                batch_size:
                  type: integer
                  minimum: 1
                buffer_size:
                  type: integer
                  minimum: 1
                target_update:
                  type: integer
                  minimum: 1
                warmup_steps:
                  type: integer
                  minimum: 0
                clip_norm:
                  type: number
                  minimum: 0
            selfplay:
              type: object
              properties:
                chunk_episodes:
                  type: integer
                  minimum: 1
                max_rounds:
                  type: integer
                  minimum: 1
                snapshot_interval:
                  type: integer
                  minimum: 1
                baseline_games:
                  type: integer
                  minimum: 0
                baseline_threshold:
                  type: number
                  minimum: 0
                  maximum: 1
                eval_games:
                  type: integer
                  minimum: 0
                eval_threshold:
                  type: number
                  minimum: 0
                  maximum: 1
                eval_workers:
                  type: integer
                  minimum: 0
                rollout_workers:
                  type: integer
                  minimum: 0
                move_gate:
                  type: number
                  minimum: 0
