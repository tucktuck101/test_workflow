version: v1
phases:
  - id: bootcamp
    name: Boot Camp
    description: Small board warm-up against simple opponents.
    gating:
      min_episodes: 5000
      min_win_rate: 0.8
    opponents:
      - opponent: random
        weight: 0.7
      - opponent: hunt_target
        weight: 0.3
    hyperparams:
      dqn:
        epsilon_start: 1.0
        epsilon_end: 0.1
        epsilon_decay: 4000
      selfplay:
        eval_games: 5000
        eval_threshold: 0.7

  - id: skirmish
    name: Skirmish Control
    description: Medium board with stronger scripted opponents.
    gating:
      min_episodes: 2000
      min_rounds: 1
      min_win_rate: 0.8
    opponents:
      - opponent: hunt_target
        weight: 0.5
      - opponent: probability
        weight: 0.5
    hyperparams:
      dqn:
        epsilon_start: 0.5
        epsilon_end: 0.05
        epsilon_decay: 6000
      selfplay:
        eval_games: 5000
        eval_threshold: 0.8
