name: Nightly Hygiene

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audits:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: NPM audit
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

  training-eval:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run training smoke
        run: ./scripts/train_smoke.sh

  project-hygiene:
    runs-on: ubuntu-latest
    env:
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Run project hygiene report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT || github.token }}
          script: |
            const admin = require('./scripts/github/project_admin.cjs');
            await admin.run({ github, context, core, mode: 'hygiene' });
