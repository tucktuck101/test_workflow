name: Project Admin

on:
  issues:
    types: [opened, reopened, edited, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  workflow_run:
    workflows: ['PR CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync project administration
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT || github.token }}
          script: |
            const admin = require('./scripts/github/project_admin.cjs');
            await admin.run({ github, context, core });
