name: Project Intake - PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

jobs:
  add-to-project:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Add PR to Delivery Board
        uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/users/tucktuck101/projects/6
          github-token: ${{ secrets.PROJECT_PAT }}
          field-keys: |
            Board Column=In Review

  mark-done:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Move PR to Done
        uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/users/tucktuck101/projects/6
          github-token: ${{ secrets.PROJECT_PAT }}
          field-keys: |
            Board Column=Done
