name: PR CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      training: ${{ steps.filter.outputs.training }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'bots/**'
              - 'tests/**'
              - 'requirements*.txt'
              - 'pyproject.toml'
            frontend:
              - 'frontend/**'
              - 'Dockerfile.frontend'
              - 'Dockerfile.training-frontend'
            training:
              - 'training/**'
              - 'configs/**'
              - 'scripts/train_smoke.sh'
              - 'tools/**'
            infra:
              - '.github/**'
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - 'k8s/**'

  backend:
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run backend tests with coverage
        run: |
          python -m pytest --maxfail=1 --disable-warnings --cov=app --cov-fail-under="${COVERAGE_THRESHOLD}"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build gameplay UI
        working-directory: frontend
        run: npm run build
      - name: Build training UI
        working-directory: frontend
        run: npm run build:training
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --coverage --watch=false

  training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run training smoke
        run: ./scripts/train_smoke.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t battleships-rl-platform-backend:pr .
      - name: Build gameplay frontend image
        run: docker build -f Dockerfile.frontend -t battleships-rl-platform-frontend:pr .
      - name: Build training UI image
        run: docker build -f Dockerfile.training-frontend -t battleships-rl-platform-training-ui:pr .
      - name: Build trainer image
        run: docker build -f Dockerfile.trainer -t battleships-rl-platform-trainer:pr .

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Run Compose smoke
        run: ./scripts/smoke_local.sh

  e2e:
    runs-on: ubuntu-latest
    needs: [changes, compose-smoke]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start stack
        run: |
          docker compose -p battleships-e2e -f docker-compose.ci.yml up -d --build backend frontend
          for _ in {1..30}; do
            if curl -sf http://localhost:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p battleships-e2e -f docker-compose.ci.yml logs backend
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e -- --reporter=list
      - name: Teardown
        if: always()
        run: docker compose -p battleships-e2e -f docker-compose.ci.yml down --remove-orphans

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: NPM audit
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint@v1
