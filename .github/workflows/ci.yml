name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: pre-commit/action@v3.0.1

  quality-gates:
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: 90 # per Quality Gates Matrix for backend; frontend thresholds set in vitest config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run quality gate checks (tests, coverage, type checks)
        run: ./ci/run_quality_gates.sh

  security:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: NPM audit (frontend)
        working-directory: frontend
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=moderate

  smoke:
    runs-on: ubuntu-latest
    needs: [quality-gates]
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke against compose backend/frontend
        run: |
          chmod +x scripts/smoke.sh
          scripts/smoke.sh

  training-smoke:
    runs-on: ubuntu-latest
    needs: [quality-gates]
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.x'
        - name: Run training smoke (mini-train)
          run: |
            chmod +x scripts/train_smoke.sh
            scripts/train_smoke.sh

  e2e:
    runs-on: ubuntu-latest
    needs: [quality-gates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Start stack (backend + frontend)
        run: |
          docker compose up -d backend frontend
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health/ready >/dev/null; then
              echo "ready"; break; fi; sleep 2; done
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Run Playwright e2e tests
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e -- --reporter=list
      - name: Teardown
        if: always()
        run: docker compose down
