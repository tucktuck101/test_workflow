name: CI Bug Logger

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  log-bug:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install js-yaml
      - name: Log CI failure as Bug
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const yaml = require('js-yaml');

            const configPath = '.github/ci-bug-config.yml';
            if (!fs.existsSync(configPath)) {
              core.info('Config not found; skipping CI bug logging.');
              return;
            }
            const cfg = yaml.load(fs.readFileSync(configPath, 'utf8'));
            if (!cfg?.enabled) {
              core.info('CI bug logging disabled.');
              return;
            }

            const run = context.payload.workflow_run;
            const branch = run.head_branch;
            if (cfg.branches && !cfg.branches.includes(branch)) {
              core.info(`Branch ${branch} not in config scope; skipping.`);
              return;
            }

            const wfCfg = (cfg.workflows || []).find(w => w.name === run.name);
            if (!wfCfg) {
              core.info(`Workflow ${run.name} not configured; skipping.`);
              return;
            }

            const jobs = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs',
              { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id }
            );
            const failingJobs = jobs.filter(j => j.conclusion && j.conclusion !== 'success');
            if (!failingJobs.length) {
              core.info('No failing jobs found.');
              return;
            }

            const job = failingJobs[0];
            const failureMessage = job?.steps?.find(s => s.conclusion === 'failure')?.name || job.name;
            const signatureString = `${run.name}:${job.name}:${branch}:${failureMessage || job.conclusion}`;
            const signatureHash = crypto.createHash('sha256').update(signatureString).digest('hex');

            const jobCfg = (wfCfg.jobs || []).find(j => j.name === job.name) || {};
            const parentFeature = jobCfg.parent_feature || wfCfg.default_parent_feature || null;
            const category = jobCfg.category || wfCfg.default_category || 'unknown';

            const triageLabel = parentFeature ? (cfg.triage_labels?.needed || 'triage: needed') : (cfg.triage_labels?.feature_needed || 'triage: feature-needed');
            const labels = [
              cfg.triage_labels?.type_bug || 'Bug',
              cfg.triage_labels?.source_ci || 'source: ci',
              triageLabel,
            ];

            const searchQuery = `repo:${context.repo.owner}/${context.repo.repo} "${signatureHash}" is:issue is:open`;
            const search = await github.rest.search.issuesAndPullRequests({ q: searchQuery });
            const runUrl = run.html_url;
            const jobUrl = job.html_url;
            const body = [
              `Summary: CI failure in ${run.name} / ${job.name} on ${branch}`,
              `Parent Feature: ${parentFeature || 'UNKNOWN (set and re-triage)'}`,
              `Detected By: github-actions`,
              `Status: new`,
              `Failure Signature: ${failureMessage || job.conclusion}`,
              `Signature Hash: ${signatureHash}`,
              `Context: workflow_run ${run.id}, branch ${branch}, sha ${run.head_sha}, actor ${run.actor?.login || 'unknown'}, job ${job.id}`,
              `Run URL: ${runUrl}`,
              `Job URL: ${jobUrl}`,
              `Environment: ${branch}`,
              `Suspected Category: ${category}`,
              `Error Details: see logs in job URL`,
              `Linked Work Items: Parent Feature: ${parentFeature || 'UNKNOWN'}`,
              `Fix Tasks:`,
              `- [ ] TASK-___`,
              `Root Cause Summary:`,
              `Reproduction / Rerun Instructions: re-run failed job from Actions UI`,
              `Acceptance Criteria:`,
              `- All Fix Tasks done and failure signature no longer reproduces.`,
            ].join('\n');

            if (search.data.total_count > 0) {
              const issue = search.data.items[0];
              core.info(`Found existing bug #${issue.number}; adding comment.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `New occurrence of signature ${signatureHash} in ${runUrl}\nJob: ${jobUrl}\nBranch: ${branch}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `BUG: CI failure ${run.name} / ${job.name} (${branch})`,
              body,
              labels,
            });
