apiVersion: batch/v1
kind: CronJob
metadata:
  name: battleship-trainer
spec:
  schedule: '0 3 * * *'
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trainer
              image: battleship-trainer:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: TRAIN_OUTPUT
                  value: /artifacts
                - name: TRAIN_ARTIFACT_NAME
                  value: model.bin
                - name: TRAIN_EPOCHS
                  value: '200'
                - name: TRAIN_SEED
                  value: '2'
                - name: TRAIN_DEVICE
                  value: cpu
                - name: TRAIN_BOARD_SIZE
                  value: '10'
                - name: TRAIN_ALLOW_ADJACENT
                  value: 'true'
              volumeMounts:
                - name: artifacts
                  mountPath: /artifacts
                - name: configs
                  mountPath: /configs
                  readOnly: true
              command: ['python', '-m', 'training.trainer']
          volumes:
            - name: artifacts
              persistentVolumeClaim:
                claimName: battleship-artifacts
            - name: configs
              configMap:
                name: battleship-configs
