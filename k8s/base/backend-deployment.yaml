apiVersion: apps/v1
kind: Deployment
metadata:
  name: battleships-backend
  namespace: battleships
  labels:
    app.kubernetes.io/name: battleships-backend
    app.kubernetes.io/part-of: battleships-rl-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: battleships-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: battleships-backend
        app.kubernetes.io/part-of: battleships-rl-platform
    spec:
      containers:
        - name: backend
          image: ghcr.io/tucktuck101/battleships-rl-platform-backend:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: info
            - name: OBSERVABILITY_ENABLED
              value: 'true'
            - name: DETERMINISTIC_MODE
              value: 'false'
            - name: FRONTEND_ORIGIN
              value: http://localhost:3000
            - name: TRAINING_FRONTEND_ORIGIN
              value: http://localhost:3001
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
